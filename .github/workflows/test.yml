name: Docker Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  pull_request_target:
    branches:
      - '**'
  workflow_run:
    workflows: ["Docker Build and Publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional environment image tag (for example: latest, manual). If not specified, uses latest."
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  detect-image-change:
    name: Detect environment image changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.image.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Docker publish inputs
        id: image
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            changed_files=$(git diff-tree --root --no-commit-id --name-only -r "${CURRENT_SHA}")
          else
            changed_files=$(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")
          fi
          if grep -Eq '^(dockerfiles/(Dockerfile\.recstore|init_env_inside_docker\.sh|git_ref\.sh)|\.gitmodules|third_party/.*|\.github/workflows/publish\.yml)$' <<< "${changed_files}"; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Environment image inputs changed; defer Docker Test until Docker Build and Publish completes."
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

  test-image:
    name: Pull image and run tests
    needs: detect-image-change
    if: >-
      always() &&
      (needs.detect-image-change.result == 'skipped' ||
       (needs.detect-image-change.result == 'success' && needs.detect-image-change.outputs.changed != 'true')) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}/recstore-devel
      TEST_CONTAINER: recstore-image-test-${{ github.run_id }}-${{ github.run_attempt }}
      PUBLISH_COVERAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 使用与已发布镜像相同的源码提交。
          # pull_request_target 触发时显式检出 PR merge ref，避免回到基线分支代码。
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number)) || github.ref }}
          # third_party 已在发布镜像阶段缓存并在测试容器中恢复，这里仅拉取主仓库代码。
          submodules: false
          fetch-depth: 0
          persist-credentials: false
          # pull_request_target 需要检出 fork 代码以在 Docker 中编译测试。
          # 安全保障：fork PR 不会发布 coverage，secrets 仅用于 GHCR 镜像拉取。
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

      - name: Resolve image reference
        id: image
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag || '' }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          REPO_LOWER="$(echo "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')"

          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            IMAGE_TAG="${INPUT_IMAGE_TAG}"
          elif [ "${EVENT_NAME}" = "workflow_run" ] && [ -n "${WORKFLOW_RUN_HEAD_SHA}" ]; then
            IMAGE_TAG="sha-$(echo "${WORKFLOW_RUN_HEAD_SHA}" | cut -c1-7)"
          else
            IMAGE_TAG="latest"
          fi

          echo "repo=${REPO_LOWER}" >> "${GITHUB_OUTPUT}"
          echo "tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull docker image
        id: pull
        run: |
          set -euo pipefail
          REPO="${{ steps.image.outputs.repo }}"
          TAG="${{ steps.image.outputs.tag }}"
          IMAGE="${REPO}:${TAG}"
          echo "Pulling image: ${IMAGE}"
          docker pull "${IMAGE}"
          echo "pulled_image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Start test container
        env:
          TEST_IMAGE: ${{ steps.pull.outputs.pulled_image }}
        run: |
          set -euo pipefail
          PULLED_IMAGE="${TEST_IMAGE}"

          docker run -d --name "${TEST_CONTAINER}" --network host \
            --security-opt seccomp=unconfined \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${PULLED_IMAGE}" \
            bash -lc 'tail -f /dev/null'

      - name: Restore initialized third_party cache
        run: |
          set -euo pipefail
          docker exec "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail
            CACHE_DIR="/opt/recstore-cache/third_party"
            if [ ! -d "${CACHE_DIR}" ]; then
              echo "No initialized third_party cache found in image. Continue without restore."
              exit 0
            fi

            echo "Restoring initialized third_party from ${CACHE_DIR} ..."
            rm -rf /workspace/third_party
            cp -a "${CACHE_DIR}" /workspace/third_party
            echo "Restore completed."
          '

      - name: Build project inside container
        run: |
          set -euo pipefail
          docker exec \
            -e PUBLISH_COVERAGE="${PUBLISH_COVERAGE}" \
            "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail
            export CI=true
            export GITHUB_ACTIONS=true
            export DEBIAN_FRONTEND=noninteractive
            export GLOG_logtostderr=1
            export GLOG_v=1

            cd /workspace
            echo "Current commit under test:"
            git rev-parse HEAD || true
            echo "Verifying bRPC test source version in container..."
            grep -n "kBrpcTestPort0\|kDistBrpcPort0" src/test/ps/brpc/*_test.cpp || true
            mkdir -p runner/logs

            if [ "${PUBLISH_COVERAGE}" = "true" ]; then
              BUILD_DIR=build_coverage
              rm -rf "${BUILD_DIR}"
              mkdir -p "${BUILD_DIR}"
              cd "${BUILD_DIR}"
              CMAKE_ARGS=(
                -DENABLE_CUDA=OFF
                -DCMAKE_BUILD_TYPE=Debug
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5
                -DCMAKE_C_FLAGS=--coverage\ -O0\ -g
                -DCMAKE_CXX_FLAGS=--coverage\ -O0\ -g
              )
              if [ -x /usr/local/cuda/bin/nvcc ]; then
                CMAKE_ARGS+=(
                  -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
                  -DCUDAToolkit_ROOT=/usr/local/cuda
                )
              fi
              cmake "${CMAKE_ARGS[@]}" ..
            else
              BUILD_DIR=build
              rm -rf "${BUILD_DIR}"
              mkdir -p "${BUILD_DIR}"
              cd "${BUILD_DIR}"
              cmake -DENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
            fi

            make -j4

            if [ "${PUBLISH_COVERAGE}" = "true" ]; then
              cd /workspace
              rm -rf build
              ln -s build_coverage build
            fi
          '

      - name: Resolve ctest exclusions
        run: |
          set -euo pipefail
          # Docker default seccomp in GitHub Actions blocks io_uring syscalls,
          # so io_uring-dependent tests are always excluded. RDMA integration
          # tests additionally need memcached; without it they are excluded too
          # (the ones with SKIP_RETURN_CODE would self-skip regardless).
          CTEST_EXCLUDE_REGEX=$(docker exec "${TEST_CONTAINER}" bash -lc '
            if command -v memcached >/dev/null 2>&1; then
              echo "test_io_backend"
            else
              echo "memcached not found; skipping RDMA integration tests." >&2
              echo "test_io_backend|pytorch_client_test_rdma_basic|pytorch_client_test_rdma|pytorch_client_test_rdma_auto"
            fi
          ')
          echo "ctest exclude regex: ${CTEST_EXCLUDE_REGEX}"
          echo "CTEST_EXCLUDE_REGEX=${CTEST_EXCLUDE_REGEX}" >> "${GITHUB_ENV}"

      # ctest runs in three lanes (steps, not jobs) so a failure is visible
      # from the step name alone: which layer broke. All lanes share the
      # container build above and append to the same log, so the overall set
      # of executed tests is identical to the previous single ctest run.
      # Lanes use continue-on-error so every lane runs even when one fails;
      # the final "Check ctest results" step fails the job.

      - name: Run ctest (unit)
        id: ctest_unit
        continue-on-error: true
        run: |
          set -euo pipefail
          docker exec \
            -e PUBLISH_COVERAGE="${PUBLISH_COVERAGE}" \
            -e CTEST_EXCLUDE_REGEX="${CTEST_EXCLUDE_REGEX}" \
            "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail

            BUILD_DIR=build
            if [ "${PUBLISH_COVERAGE}" = "true" ]; then
              BUILD_DIR=build_coverage
              export PS_SERVER_PATH="/workspace/${BUILD_DIR}/bin/ps_server"
            fi

            cd "/workspace/${BUILD_DIR}"
            : > /workspace/runner/logs/ctest.log
            # Banner lets the annotation script attribute each failed
            # test to its lane (same format as tools/ci/reproduce.sh).
            echo "===== ctest lane: unit =====" | tee -a /workspace/runner/logs/ctest.log
            ctest --output-on-failure --progress \
              --timeout 300 \
              -E "${CTEST_EXCLUDE_REGEX}" \
              -LE "python|rdma_integration|^perf$" \
              2>&1 | tee -a /workspace/runner/logs/ctest.log
            exit ${PIPESTATUS[0]}
          '

      - name: Run ctest (python)
        id: ctest_python
        continue-on-error: true
        run: |
          set -euo pipefail
          docker exec \
            -e PUBLISH_COVERAGE="${PUBLISH_COVERAGE}" \
            -e CTEST_EXCLUDE_REGEX="${CTEST_EXCLUDE_REGEX}" \
            "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail

            BUILD_DIR=build
            if [ "${PUBLISH_COVERAGE}" = "true" ]; then
              BUILD_DIR=build_coverage
              export PS_SERVER_PATH="/workspace/${BUILD_DIR}/bin/ps_server"
            fi

            cd "/workspace/${BUILD_DIR}"
            # Banner lets the annotation script attribute each failed
            # test to its lane (same format as tools/ci/reproduce.sh).
            echo "===== ctest lane: python =====" | tee -a /workspace/runner/logs/ctest.log
            ctest --output-on-failure --progress \
              --timeout 300 \
              -E "${CTEST_EXCLUDE_REGEX}" \
              -L "python" \
              2>&1 | tee -a /workspace/runner/logs/ctest.log
            exit ${PIPESTATUS[0]}
          '

      - name: Run ctest (rdma integration)
        id: ctest_rdma
        continue-on-error: true
        run: |
          set -euo pipefail
          docker exec \
            -e PUBLISH_COVERAGE="${PUBLISH_COVERAGE}" \
            -e CTEST_EXCLUDE_REGEX="${CTEST_EXCLUDE_REGEX}" \
            "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail

            BUILD_DIR=build
            if [ "${PUBLISH_COVERAGE}" = "true" ]; then
              BUILD_DIR=build_coverage
              export PS_SERVER_PATH="/workspace/${BUILD_DIR}/bin/ps_server"
            fi

            cd "/workspace/${BUILD_DIR}"
            # These tests self-skip (exit 77) when RDMA hardware is absent.
            # Banner lets the annotation script attribute each failed
            # test to its lane (same format as tools/ci/reproduce.sh).
            echo "===== ctest lane: rdma_integration =====" | tee -a /workspace/runner/logs/ctest.log
            ctest --output-on-failure --progress \
              --timeout 300 \
              -E "${CTEST_EXCLUDE_REGEX}" \
              -L "rdma_integration" \
              2>&1 | tee -a /workspace/runner/logs/ctest.log
            exit ${PIPESTATUS[0]}
          '

      - name: Emit failed-test annotations
        if: always()
        run: |
          set -euo pipefail
          # ::error commands printed by docker exec are picked up by the
          # runner and surface on the run/PR page without downloading logs.
          docker exec "${TEST_CONTAINER}" bash -lc '
            python3 /workspace/tools/ci/ctest_annotations.py /workspace/runner/logs/ctest.log
          '

      - name: Check ctest results
        if: always()
        run: |
          set -euo pipefail
          failed=0
          if [ "${{ steps.ctest_unit.outcome }}" = "failure" ]; then
            echo "::error::ctest unit lane failed"
            failed=1
          fi
          if [ "${{ steps.ctest_python.outcome }}" = "failure" ]; then
            echo "::error::ctest python lane failed"
            failed=1
          fi
          if [ "${{ steps.ctest_rdma.outcome }}" = "failure" ]; then
            echo "::error::ctest rdma integration lane failed"
            failed=1
          fi
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

      - name: Generate and publish coverage
        if: env.PUBLISH_COVERAGE == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker exec "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail
            cd /workspace
            export CI=true
            export GITHUB_ACTIONS=true
            export DEBIAN_FRONTEND=noninteractive
            export PATH="${HOME}/.local/bin:/usr/local/cuda/bin:${PATH}"
            python3 -m pip install --user gcovr coverage

            CPP_REPORT_DIR=/workspace/build_coverage/coverage/cpp
            PY_REPORT_DIR=/workspace/build_coverage/coverage/python
            mkdir -p "${CPP_REPORT_DIR}" "${PY_REPORT_DIR}"

            eval "$(python3 /workspace/tools/coverage/coverage_scope.py --labeler /workspace/.github/labeler.yml --format gcovr)"
            gcovr \
              --root /workspace \
              --object-directory /workspace/build_coverage \
              "${COVERAGE_SCOPE_ARGS[@]}" \
              --exclude ".*third_party/.*" \
              --exclude "build_coverage/.*" \
              --exclude ".*/build_coverage/.*" \
              --exclude "build/.*" \
              --exclude ".*/build/.*" \
              --exclude-directories ".*/CMakeFiles/[0-9.]+/CompilerId.*" \
              --xml-pretty --xml "${CPP_REPORT_DIR}/coverage.xml" \
              --html-details "${CPP_REPORT_DIR}/index.html" \
              --txt "${CPP_REPORT_DIR}/coverage.txt" \
              --print-summary

            export LD_LIBRARY_PATH="/workspace/build_coverage/lib:${LD_LIBRARY_PATH:-}"
            export PYTHONPATH="/workspace/src/python/pytorch:${PYTHONPATH:-}"
            export PS_SERVER_PATH="/workspace/build_coverage/bin/ps_server"

            python3 -m coverage erase
            (
              cd /workspace/src/test/framework/pytorch
              python3 -m coverage run --parallel-mode test_client.py /workspace/build_coverage/lib/lib_recstore_ops.so
            )
            (
              cd /workspace/src/python/pytorch
              python3 -m coverage run --parallel-mode -m unittest recstore.unittest.test_dist_emb
            )
            python3 -m coverage combine \
              /workspace/src/test/framework/pytorch \
              /workspace/src/python/pytorch
            eval "$(python3 /workspace/tools/coverage/coverage_scope.py --labeler /workspace/.github/labeler.yml --format coverage)"
            python3 -m coverage html "${COVERAGE_SCOPE_ARGS[@]}" -d "${PY_REPORT_DIR}"
            python3 -m coverage xml "${COVERAGE_SCOPE_ARGS[@]}" -o "${PY_REPORT_DIR}/coverage.xml"
            python3 -m coverage report "${COVERAGE_SCOPE_ARGS[@]}" -m | tee "${PY_REPORT_DIR}/coverage.txt"
          '

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bash .github/scripts/pages/update_gh_pages.sh \
            --source build_coverage/coverage \
            --mode coverage \
            --message "ci: deploy coverage reports"

      - name: Upload coverage reports
        if: always() && env.PUBLISH_COVERAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: build_coverage/coverage/
          if-no-files-found: ignore

      - name: Print ctest log summary
        if: always()
        run: |
          set -euo pipefail
          echo "===== ctest log summary (last 200 lines) ====="
          docker exec "${TEST_CONTAINER}" bash -lc '
            if [ -f /workspace/runner/logs/ctest.log ]; then
              tail -n 200 /workspace/runner/logs/ctest.log
            else
              echo "ctest log not found: /workspace/runner/logs/ctest.log"
            fi
          '
          echo "===== end of ctest log summary ====="

      - name: Collect test logs from container
        if: always()
        run: |
          set -euo pipefail
          mkdir -p runner/logs build
          docker cp "${TEST_CONTAINER}:/workspace/runner/logs" runner/ || true
          docker cp "${TEST_CONTAINER}:/workspace/build/CMakeCache.txt" build/CMakeCache.txt || true
          docker cp "${TEST_CONTAINER}:/workspace/build_coverage/CMakeCache.txt" build/CMakeCache.coverage.txt || true
          docker rm -f "${TEST_CONTAINER}" || true

      - name: Upload docker image test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-test-logs
          path: |
            runner/logs/
            init_env_*.log
            build/CMakeCache.txt
            build/CMakeCache.coverage.txt
