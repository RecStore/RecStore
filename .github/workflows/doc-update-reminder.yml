name: Documentation Update

on:
  pull_request_target:
    paths:
      - 'src/**'
      - 'model_zoo/**'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: documentation-update-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  check-docs:
    if: github.event.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          # pull_request_target runs with the base repository's token and secrets,
          # so this workflow must not check out or execute fork code (pwn-request
          # risk). Only the trusted base branch is checked out; the PR head is
          # fetched as git objects below and never run.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pr-head"

          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/changed-files.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check documentation
        id: check
        run: |
          python3 tools/docs/check_updated_docs.py "$(cat "$RUNNER_TEMP/changed-files.txt")" > "$RUNNER_TEMP/doc-comment.txt"
          if [ -s "$RUNNER_TEMP/doc-comment.txt" ]; then
            echo "has_comment=true" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Comment PR
        if: steps.check.outputs.has_comment == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { upsertComment } = require('./.github/scripts/ci/notifications.js');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/doc-comment.txt`, 'utf8');
            await upsertComment(github, context.repo, context.issue.number,
              'documentation-update', body, '## 📚 Documentation Update');
